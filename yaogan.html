<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
.drawer {
  height: 0;
  overflow: hidden;
  transition: height 0.35s ease;
}
.drawer-inner {
  padding:10px;
}
  </style>
</head>
<body>
  <div class="drawer-wrap">
  <button id="btn">切换</button>
  <div class="drawer">
    <div class="drawer-inner">
      动态内容<br/>动态内容<br/>动态内容
    </div>
  </div>
</div>
<script>
  const drawer = document.querySelector('.drawer')
const inner = document.querySelector('.drawer-inner')
let open = false

document.querySelector('#btn').addEventListener('click', ()=>{
  if(!open){
    // 展开：拿到真实内容高度
    drawer.style.height = `${inner.scrollHeight}px`
    // 动画完成后，设置 auto，后续内容变化自动撑开
    drawer.ontransitionend = ()=>{
      drawer.style.height = 'auto'
    }
  }else{
    // 收起：不能直接0；要先拿到当前真实px高度，再赋值0触发动画
    drawer.style.height = `${drawer.scrollHeight}px`
    // 强制重绘，浏览器回流，必须短暂延迟
    requestAnimationFrame(()=>{
      drawer.style.height = '0px'
    })
    drawer.ontransitionend = null
  }
  open = !open
})
</script>
</body>
</html>
