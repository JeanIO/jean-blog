<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <div id="app">
    <input v-model="msg" />

  </div>

  <script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.js"></script>
  <script>
    new Vue({
      el: '#app',
      data: {
        msg: 'Hello Vue!'
      },
      watch: {
        msg(newVal, oldVal) {
          console.log('msg changed from', oldVal, 'to', newVal);
        }
      }
    })
  </script>
</body>
</html>
