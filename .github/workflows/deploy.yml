name: 自动部署 Monorepo 项目
on:
  push:
    branches: [ main ] # 如果你主分支是 master 请修改

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取代码
      - name: 拉取代码
        uses: actions/checkout@v4

      # ================= 打包 blog-client =================
      - name: 设置 Node 最新版
        uses: actions/setup-node@v4
        with:
          node-version: 'latest'

      - name: 安装依赖并打包 blog-client
        run: |
          cd blog-client
          echo "====== 当前 npm 配置 ======"
          npm config list
          npm install
          npm run build
        env:
          # 强行替换锁文件里的主机名为官方源
          npm_config_replace_registry_host: "always"
          # 允许拉取
          npm_config_allow_remote: "all"


      # ================= 打包 blog-manage =================
      - name: 设置 Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 安装依赖并打包 blog-manage
        run: |
          cd blog-manage
          npm install
          npm run build

      # ================= 打包 back-stage2 =================
      - name: 切回 Node 最新版
        uses: actions/setup-node@v4
        with:
          node-version: 'latest'

      - name: 安装依赖并打包 back-stage2
        run: |
          cd back-stage2
          npm install
          npm run build

      # ================= 上传所有产物 =================
      - name: 上传 blog-client 产物
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.TENCENT_ADDR }}
          username: ubuntu
          key: ${{ secrets.TENCENT_PRIVATEKEY }}
          source: "blog-client/dist/*"
          target: "/home/ubuntu/jean-blog2/blog-client"
          strip_components: 2

      - name: 上传 blog-manage 产物
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.TENCENT_ADDR }}
          username: ubuntu
          key: ${{ secrets.TENCENT_PRIVATEKEY }}
          source: "blog-manage/dist/*"
          target: "/home/ubuntu/jean-blog2/blog-manage"
          strip_components: 2

      - name: 上传 back-stage2 产物
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.TENCENT_ADDR }}
          username: ubuntu
          key: ${{ secrets.TENCENT_PRIVATEKEY }}
          source: "back-stage2/dist/*"
          # 注意这里！为了不覆盖你服务器上的 node_modules 和 package.json
          # 我们先把新的 dist 传到一个临时目录，稍后通过 SSH 移动过去
          target: "/home/ubuntu/jean-blog2/back-stage2-temp"
          strip_components: 2

      # ================= 替换后端产物并重启 =================
      - name: SSH 登录服务器重启后端
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.TENCENT_ADDR }}
          username: ubuntu
          key: ${{ secrets.TENCENT_PRIVATEKEY }}
          script: |
            cd /home/ubuntu/jean-blog2/back-stage2
            
            # 1. 删除服务器上旧的 dist 目录
            rm -rf dist
            
            # 2. 把刚才上传到临时目录里的新产物，移动到当前目录并改名为 dist
            mv /home/ubuntu/jean-blog2/back-stage2-temp /home/ubuntu/jean-blog2/back-stage2/dist
            
            # 3. 如果你改了 package.json（新增了库），才需要取消下面这行的注释去安装依赖，平时不用装，节省时间
            # npm install --production
            
            # 4. 重启后端服务
            sudo pm2 restart blog-api